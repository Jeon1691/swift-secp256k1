# TEMPORARY — fork-only harness, not for upstream. Runs the patched
# Scripts/verify-p256k-xcframework.sh against a published release asset on the
# same image and toolchain pin as xcframework-release.yml, plus two negative
# controls that must fail closed.
name: Verify XCFramework iOS Simulator leg (temporary)
on:
  push:
    branches: ['verify/**']
permissions: {}
jobs:
  verify:
    name: ${{ matrix.case }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        case: [gate, fail-control, zero-control]
    env:
      # Same pin as xcframework-release.yml.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      RELEASE_TAG: '0.25.1'
      # Digest GitHub records for the 0.25.1 P256K.xcframework.zip asset.
      EXPECTED_SHA256: 98ae10faf5655da4240355432add79f5733dc666a162ed06ed0d5f051a48dbaa
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Environment
        run: |
          sw_vers
          xcodebuild -version
          echo "iphonesimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
          jq --version
          xcrun simctl list runtimes
      - name: Fetch release artifact
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/P256K.xcframework.zip" \
            "https://github.com/21-DOT-DEV/swift-secp256k1/releases/download/$RELEASE_TAG/P256K.xcframework.zip"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/P256K.xcframework.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/P256K.xcframework.zip" -d "$RUNNER_TEMP/xcf"
      - name: Prepare negative control
        if: matrix.case != 'gate'
        run: |
          f=Tests/XCFrameworkTests/XCFrameworkTests.swift
          if [ "$CASE" = fail-control ]; then
            # Deliberate iOS-only failure; macOS must still pass.
            perl -0pi -e 's/(        #expect\(String\(bytes: privateKey\.dataRepresentation\) == expectedPrivateKey\)\n)/$1        #if os(iOS)\n        #expect(Bool(false), "negative control: deliberate iOS-only failure")\n        #endif\n/' "$f"
            grep -q 'negative control' "$f"
          else
            # Zero tests on iOS; macOS still runs the suite.
            perl -0pi -e 's/(struct XCFrameworkTestSuite)/#if !os(iOS)\n$1/; s/\z/#endif\n/' "$f"
            grep -q '#if !os(iOS)' "$f"
          fi
          git diff --stat
      - name: Run verifier
        run: |
          set +e
          bash Scripts/verify-p256k-xcframework.sh "$RUNNER_TEMP/xcf/P256K.xcframework" \
            "iOS" "iOS Simulator" "macOS" "tvOS" "tvOS Simulator" "watchOS" "watchOS Simulator" \
            > "$RUNNER_TEMP/verify.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/verify.log"
          echo "verifier exit: $rc"
          case "$CASE" in
            gate)
              test "$rc" -eq 0
              grep -q '^consumer test: iOS Simulator passed [1-9]' "$RUNNER_TEMP/verify.log" ;;
            fail-control)
              test "$rc" -ne 0
              grep -q '^failure: .*Expectation failed' "$RUNNER_TEMP/verify.log"
              grep -q '^error: iOS Simulator consumer test failed (xcodebuild exit ' "$RUNNER_TEMP/verify.log" ;;
            zero-control)
              test "$rc" -eq 1
              grep -q '^error: iOS Simulator run reported no passing test' "$RUNNER_TEMP/verify.log" ;;
          esac
          echo "case $CASE: expected outcome observed"
      - name: Simulator state after run
        if: ${{ !cancelled() }}
        run: xcrun simctl list devices booted
