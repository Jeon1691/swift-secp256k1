# TEMPORARY — fork-only harness, not for upstream. Runs the patched verifier
# (iOS + tvOS simulator legs) against a published release asset on the same
# image and toolchain pin as xcframework-release.yml, plus tvOS negative
# controls that must fail closed.
name: Verify tvOS simulator leg (temporary)
on:
  push:
    branches: ['verify/**']
permissions: {}
jobs:
  verify:
    name: ${{ matrix.case }}
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case: [gate-1, gate-2, gate-3, gate-4, gate-5, gate-6, gate-7, gate-8, gate-9, gate-10, tvos-fail, tvos-zero]
    env:
      # Same pin as xcframework-release.yml.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      RELEASE_TAG: '0.25.1'
      # Digest GitHub records for the 0.25.1 P256K.xcframework.zip asset.
      EXPECTED_SHA256: 98ae10faf5655da4240355432add79f5733dc666a162ed06ed0d5f051a48dbaa
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Environment
        run: |
          xcodebuild -version
          echo "image: $ImageOS $ImageVersion"
          echo "appletvsimulator SDK: $(xcrun --sdk appletvsimulator --show-sdk-version)"
      - name: Fetch release artifact
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/P256K.xcframework.zip" \
            "https://github.com/21-DOT-DEV/swift-secp256k1/releases/download/$RELEASE_TAG/P256K.xcframework.zip"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/P256K.xcframework.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/P256K.xcframework.zip" -d "$RUNNER_TEMP/xcf"
      - name: Prepare negative control
        if: startsWith(matrix.case, 'tvos-')
        run: |
          f=Tests/XCFrameworkTests/XCFrameworkTests.swift
          if [ "$CASE" = tvos-fail ]; then
            # Deliberate tvOS-only failure; macOS and iOS must still pass.
            perl -0pi -e 's/(        #expect\(String\(bytes: privateKey\.dataRepresentation\) == expectedPrivateKey\)\n)/$1        #if os(tvOS)\n        #expect(Bool(false), "negative control: deliberate tvOS-only failure")\n        #endif\n/' "$f"
            grep -q 'negative control' "$f"
          else
            # Zero tests on tvOS; macOS and iOS still run the suite.
            perl -0pi -e 's/(struct XCFrameworkTestSuite)/#if !os(tvOS)\n$1/; s/\z/#endif\n/' "$f"
            grep -q '#if !os(tvOS)' "$f"
          fi
          git diff --stat
      - name: Run verifier (timestamped)
        run: |
          set +e
          set -o pipefail
          /bin/bash Scripts/verify-p256k-xcframework.sh "$RUNNER_TEMP/xcf/P256K.xcframework" \
            "iOS" "iOS Simulator" "macOS" "tvOS" "tvOS Simulator" "watchOS" "watchOS Simulator" 2>&1 \
            | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done > "$RUNNER_TEMP/verify.log"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/verify.log"
          echo "verifier exit: $rc"
          log="$RUNNER_TEMP/verify.log"
          if grep -q 'retrying once' "$log"; then echo "RETRY OBSERVED in $CASE"; fi
          if grep -q 'rescanning runtime images' "$log"; then echo "RESCAN OBSERVED in $CASE"; fi
          grep -E 'waited [0-9]+s for .* runtime images|still re-staging' "$log" | sed "s/^/SETTLE OBSERVED in $CASE: /" || true
          grep -q ' consumer test: iOS Simulator passed [1-9]' "$log"
          case "$CASE" in
            gate-*)
              test "$rc" -eq 0
              grep -q ' consumer test: tvOS Simulator passed [1-9]' "$log" ;;
            tvos-fail)
              test "$rc" -ne 0
              grep -q ' failure: .*Expectation failed' "$log"
              grep -q ' error: tvOS Simulator consumer test failed (xcodebuild exit ' "$log" ;;
            tvos-zero)
              test "$rc" -eq 1
              grep -q ' error: tvOS Simulator run reported no passing test' "$log" ;;
          esac
          echo "case $CASE: expected outcome observed"
      - name: Simulator state after run
        if: ${{ !cancelled() }}
        run: xcrun simctl list devices booted
